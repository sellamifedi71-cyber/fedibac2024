name: PHP syntax checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint every PHP file in the project
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n 1 php -l
