name: PHP syntax checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint application PHP files
        run: |
          php -l 'config.php'
          php -l 'index.php'
          php -l 'ajout.php'
          php -l 'location.php'
          php -l 'catalogue.php'
